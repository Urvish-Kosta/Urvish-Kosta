name: instruction of the day

on:
  schedule:
    - cron: "10 0 * * *"   # 00:10 UTC daily — new instruction
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate animated pipeline SVG
        run: python scripts/pipeline.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/pipeline-of-the-day.svg
          git diff --staged --quiet || git commit -m "chore: new instruction of the day for $(date -u +%Y-%m-%d)"
          git push
